name: MineSayme Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assemblerelease

    - name: Generate signing keystore
      run: |
        keytool -genkey -v -keystore minesayme.keystore \
          -alias minesayme -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass minesayme -keypass minesayme \
          -dname "CN=MineSayme, OU=Chumian, O=Chumian, L=Liuan, ST=Anhui, C=CN"

    - name: Sign APK
      run: |
        cd android/app/build/outputs/apk/release/
        UNSIGNED=$(ls app-arm64-v8a-release-unsigned.apk 2>/dev/null | head -1)
        if [ -z "$UNSIGNED" ]; then
          echo "Looking for any unsigned APK..."
          ls -la
          UNSIGNED=$(ls app-*-release-unsigned.apk 2>/dev/null | head -1)
        fi
        echo "Signing: $UNSIGNED"
        $ANDROID_SDK_ROOT/build-tools/*/apksigner sign \
          --ks ../../../../../minesayme.keystore \
          --ks-key-alias minesayme \
          --ks-pass pass:minesayme \
          --key-pass pass:minesayme \
          --out MineSayme-arm64-v8a-release.apk \
          "$UNSIGNED"
        ls -la MineSayme-arm64-v8a-release.apk

    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: MineSayme-arm64-v8a-signed
        path: android/app/build/outputs/apk/release/MineSayme-arm64-v8a-release.apk
        if-no-files-found: error

    - name: Upload all APK outputs
      uses: actions/upload-artifact@v4
      with:
        name: MineSayme-all-apks
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore
