name: MineSayme Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android NDK
      run: |
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "ndk;26.3.11579264" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "platform-tools"

    - name: Prepare signing keystore
      run: |
        rm -f minesayme.keystore
        keytool -genkey -v -keystore minesayme.keystore \
          -alias minesayme -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass minesayme -keypass minesayme \
          -dname "CN=MineSayme, OU=Chumian, O=Chumian, L=Liuan, ST=Anhui, C=CN"

    - name: Create local.properties
      run: |
        cd android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "keystore=../../minesayme.keystore" >> local.properties
        echo "keystore.password=minesayme" >> local.properties
        echo "key=minesayme" >> local.properties
        echo "key.password=minesayme" >> local.properties
        cat local.properties

    - name: Build release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew app:assembleRelease --stacktrace

    - name: Sign APK
      run: |
        cd android/app/build/outputs/apk/release/
        UNSIGNED=$(ls app-*-release-unsigned.apk 2>/dev/null | head -1)
        if [ -n "$UNSIGNED" ]; then
          $ANDROID_SDK_ROOT/build-tools/*/apksigner sign \
            --ks ../../../../../minesayme.keystore \
            --ks-key-alias minesayme \
            --ks-pass pass:minesayme \
            --key-pass pass:minesayme \
            --out MineSayme-arm64-v8a-release.apk \
            "$UNSIGNED" || cp "$UNSIGNED" MineSayme-arm64-v8a-release.apk
        else
          echo "No unsigned APK found, listing directory:"
          ls -la
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: MineSayme-arm64-v8a
        path: android/app/build/outputs/apk/release/MineSayme-arm64-v8a-release.apk
        if-no-files-found: error

    - name: Upload all APK outputs
      uses: actions/upload-artifact@v4
      with:
        name: MineSayme-all-apks
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore
